name: Build DFRoot APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build APK
        run: |
          chmod +x create-keystore.sh build.sh
          ./create-keystore.sh
          ./build.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dfroot-apk
          path: "*.apk"
